# Run the app on PostgreSQL instead of SQLite:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
# The schema is created / migrated by Alembic when the app starts.
services:
  db:
    image: postgres:16-alpine
    container_name: sap-b1-db
    environment:
      POSTGRES_USER: sapb1
      POSTGRES_PASSWORD: sapb1
      POSTGRES_DB: sapb1
    volumes:
      - b1-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapb1 -d sapb1"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  app:
    environment:
      DATABASE_URL: postgresql+psycopg://sapb1:sapb1@db:5432/sapb1
    depends_on:
      db:
        condition: service_healthy

volumes:
  b1-pg:
